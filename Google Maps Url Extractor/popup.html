<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 350px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        h2 {
            margin-top: 0;
            color: #1a73e8;
        }

        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            background-color: #e8f0fe;
            color: #1967d2;
        }

        .button-container {
            margin: 15px 0;
        }

        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }

        #startBtn {
            background-color: #1a73e8;
            color: white;
        }

        #startBtn:hover {
            background-color: #1765cc;
        }

        #startBtn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #stopBtn {
            background-color: #d93025;
            color: white;
        }

        #stopBtn:hover {
            background-color: #c5221f;
        }

        #exportBtn {
            background-color: #34a853;
            color: white;
        }

        #exportBtn:hover {
            background-color: #2d9448;
        }

        #exportBtn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .info {
            font-size: 13px;
            color: #5f6368;
            margin: 10px 0;
        }

        .count {
            font-size: 16px;
            font-weight: bold;
            color: #1a73e8;
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <h2>🗺️ Maps Scraper</h2>

    <div class="status" id="status">
        Ready to start scraping
    </div>

    <div class="count" id="count">
        Businesses found: 0
    </div>

    <div class="button-container">
        <button id="startBtn">Start Scraping</button>
        <button id="stopBtn" style="display: none;">Stop Scraping</button>
        <button id="exportBtn" disabled>Export to CSV</button>
    </div>

    <div class="info">
        <strong>Instructions:</strong>
        <ol style="margin: 8px 0; padding-left: 20px;">
            <li>Search for businesses on Google Maps</li>
            <li>Click "Start Scraping"</li>
            <li>Wait for scrolling to complete</li>
            <li>Click "Export to CSV" to download</li>
        </ol>
    </div>

    <script src="popup.js"></script>
</body>

</html>
