<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 400px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        h2 {
            margin: 0 0 15px 0;
            font-size: 18px;
            color: #333;
        }

        .file-input-wrapper {
            margin-bottom: 15px;
        }

        input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 10px;
        }

        button:hover {
            background-color: #45a049;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 4px;
            font-size: 13px;
            min-height: 60px;
        }

        .progress {
            margin-top: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: #4CAF50;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
        }

        .settings {
            margin-bottom: 15px;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 4px;
        }

        .settings label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
        }

        .settings input[type="number"] {
            width: 100%;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <h2>📍 Maps Business Scraper</h2>

    <div class="file-input-wrapper">
        <label for="csvFile">Upload CSV File:</label>
        <input type="file" id="csvFile" accept=".csv">
    </div>

    <div class="settings">
        <label for="delay">Delay between pages (ms):</label>
        <input type="number" id="delay" value="3000" min="1000" max="10000" step="500">
    </div>

    <button id="startBtn" disabled>Start Scraping</button>
    <button id="stopBtn" disabled>Stop Scraping</button>
    <button id="downloadBtn" disabled>Download Results</button>

    <div id="status">
        <div>Status: Ready</div>
        <div class="progress" style="display: none;">
            <div class="progress-bar">
                <div class="progress-fill" style="width: 0%;">0%</div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
